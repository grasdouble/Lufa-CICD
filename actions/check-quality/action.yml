name: Check quality
description: Run caller-selected lint, typecheck, and formatting commands.

inputs:
  check-agent-rules:
    description: Check the caller's generated AGENTS.md block against the shared Core rules.
    required: false
    default: 'false'
  lint-command:
    description: Optional shell command to lint the project or its packages; leave empty to skip linting.
    required: false
    default: ''
  typecheck-command:
    description: Optional shell command to typecheck the project or its packages; leave empty to skip typechecking.
    required: false
    default: ''
  format-command:
    description: Optional shell command to check formatting; leave empty to skip formatting.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check shared agent rules
      if: inputs.check-agent-rules == 'true'
      uses: grasdouble/Lufa-CICD/actions/sync-agents@sync-agents-v1
      with:
        mode: check

    - name: Lint packages
      if: always() && inputs.lint-command != ''
      shell: bash
      env:
        QUALITY_COMMAND: ${{ inputs.lint-command }}
      run: bash -e -o pipefail -c "$QUALITY_COMMAND"

    - name: Typecheck packages
      if: always() && inputs.typecheck-command != ''
      shell: bash
      env:
        QUALITY_COMMAND: ${{ inputs.typecheck-command }}
      run: bash -e -o pipefail -c "$QUALITY_COMMAND"

    - name: Check formatting
      if: always() && inputs.format-command != ''
      shell: bash
      env:
        QUALITY_COMMAND: ${{ inputs.format-command }}
      run: bash -e -o pipefail -c "$QUALITY_COMMAND"
