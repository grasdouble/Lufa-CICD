name: Setup Node.js and pnpm
description: Set up Node.js, pnpm caching and registry authentication without checkout or dependency installation.

inputs:
  node-version-file:
    description: Version file in the calling repository.
    required: false
    default: .tool-versions
  github-token:
    description: Token used to authenticate package downloads or publication.
    required: true
  registry-url:
    description: Package registry URL.
    required: false
    default: https://npm.pkg.github.com
  scope:
    description: Package scope associated with the registry.
    required: false
    default: '@grasdouble'
  cache-dependency-path:
    description: Lockfile paths used to key the pnpm store cache.
    required: false
    default: pnpm-lock.yaml

outputs:
  node-version:
    description: Installed Node.js version.
    value: ${{ steps.node.outputs.node-version }}
  cache-hit:
    description: Whether the pnpm store cache was an exact match.
    value: ${{ steps.node.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      with:
        run_install: false

    - name: Set up Node.js and registry
      id: node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Make registry authentication available to subsequent steps
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.github-token }}
      run: |
        if [[ -z "$REGISTRY_TOKEN" || "$REGISTRY_TOKEN" == *$'\n'* || "$REGISTRY_TOKEN" == *$'\r'* ]]; then
          echo "::error::A non-empty, single-line registry token is required."
          exit 1
        fi
        printf '::add-mask::%s\n' "$REGISTRY_TOKEN"
        printf 'NODE_AUTH_TOKEN=%s\n' "$REGISTRY_TOKEN" >> "$GITHUB_ENV"
