name: Catalogue CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-workflows:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout catalogue
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate workflows with the local action
        uses: ./actions/lint-workflows

  test-actions:
    name: Test shared actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout catalogue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise the local Node.js and pnpm action
        uses: ./actions/setup-node-pnpm
        with:
          node-version-file: actions/setup-node-pnpm/__tests__/fixtures/.tool-versions
          github-token: ${{ github.token }}
      - name: Check pnpm and registry configuration
        run: |
          pnpm --version
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.equal(process.versions.node.split('.')[0], '24');
          assert.ok(process.env.NODE_AUTH_TOKEN);
          const config = readFileSync(process.env.NPM_CONFIG_USERCONFIG, 'utf8');
          assert.ok(config.includes('@grasdouble:registry=https://npm.pkg.github.com'));
          assert.ok(config.includes('${NODE_AUTH_TOKEN}'));
          assert.ok(!config.includes(process.env.NODE_AUTH_TOKEN));
          JS
      - name: Install public release tooling
        # pnpm also checks private development dependency metadata with --prod.
        run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - name: Validate Changesets configuration and pending versions
        # The version PR has already consumed the changesets it applies.
        if: github.head_ref != 'changeset-release/main' && github.ref_name != 'changeset-release/main'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            pnpm changeset status
          else
            pnpm changeset status --since="origin/$BASE_REF"
          fi
      - name: Test action behavior and release automation
        run: node --test actions/*/__tests__/*.test.mjs scripts/__tests__/*.test.mjs

  release-actions:
    name: Release actions
    needs: [lint-workflows, test-actions]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      packages: read
    concurrency:
      group: catalogue-releases
      cancel-in-progress: false
    steps:
      - name: Checkout validated catalogue revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that this run still targets the current main revision
        id: revision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            const current = data.commit.sha === context.sha;
            core.setOutput('current', current);
            if (!current) core.notice('A newer main revision exists; its CI run will manage releases.');

      - name: Set up Node.js and pnpm
        if: steps.revision.outputs.current == 'true'
        uses: ./actions/setup-node-pnpm
        with:
          node-version-file: actions/setup-node-pnpm/__tests__/fixtures/.tool-versions
          github-token: ${{ github.token }}

      - name: Install public release tooling
        if: steps.revision.outputs.current == 'true'
        # pnpm also checks private development dependency metadata with --prod.
        run: pnpm install --prod --frozen-lockfile --ignore-scripts

      # Publish before Changesets prepares its version branch and modifies the checkout.
      - name: Publish merged action versions and reconcile major aliases
        if: steps.revision.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.LUFA_CI_SECRET_WRITE || github.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { readActionPackages } = await import(pathToFileURL(resolve('scripts/action-packages.mjs')).href);
            const { publishActions } = await import(pathToFileURL(resolve('scripts/publish-actions.mjs')).href);
            const { syncMajorTags } = await import(pathToFileURL(resolve('scripts/sync-major-tags.mjs')).href);
            const actions = await readActionPackages(process.cwd());
            const { published, confirmedTags } = await publishActions({ github, ...context.repo, sha: context.sha, actions });
            for (const tag of published) core.info(`Published ${tag}`);
            const components = Object.fromEntries(actions.map(({ path, component }) => [path, { component }]));
            const updates = await syncMajorTags({ github, ...context.repo, components, confirmedTags });
            for (const { alias, sha } of updates) core.info(`${alias} -> ${sha}`);

      - name: Create or update the Changesets version PR
        if: steps.revision.outputs.current == 'true'
        # Version-only mode: npm publication and Changesets-generated tags are disabled.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.LUFA_CI_SECRET_WRITE || github.token }}
          version-script: pnpm run version:actions
          pr-title: 'chore: release action versions'
          commit-message: 'chore: release action versions'
          create-github-releases: false
          push-git-tags: false
